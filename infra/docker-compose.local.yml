# Run the PRODUCTION stack locally, with no domain and no TLS.
#
#   ./infra/local-up.sh
#
# An override on docker-compose.prod.yml — same images, same env, same worker
# split, same migration step. The only differences are the ones a public
# hostname would otherwise force. Rehearsing on a stack that differs from
# production in other ways tells you nothing.
#
# WHY NO CADDY. Caddy would try to obtain a Let's Encrypt certificate for
# API_DOMAIN and fail forever without a public name pointing at this machine.
# It is simply not started here (the up script names its services explicitly);
# the API is published on loopback instead.
#
# WHY 127.0.0.1 AND NOT A LAN IP. Two hard reasons, both discovered by reading
# the client rather than guessing:
#
#   1. apps/web/src/lib/api.ts calls crypto.randomUUID() for every mutation's
#      idempotency key. That API is SECURE-CONTEXT ONLY. `localhost` counts as
#      trustworthy; `http://192.168.x.x` does not — so on a LAN address every
#      POST in the game throws before the request is even sent.
#   2. Session cookies are set `secure: true` under NODE_ENV=production
#      (auth/routes.ts). Chrome permits Secure cookies on http://localhost and
#      nowhere else insecure, so auth works here and would silently fail there.
#
# NODE_ENV stays `production`. Do NOT set it to development to dodge the cookie
# flag: that also un-gates the dev-only warzone routes, and the whole point of a
# rehearsal is to exercise the configuration you are actually going to run.

name: shardkeep

services:
  postgres:
    # Published so you can psql into it during the rehearsal. Loopback only —
    # this must never become a habit that migrates into the prod file.
    ports: ['127.0.0.1:5434:5432']

  api:
    # Loopback only. Not 0.0.0.0: on a laptop that is the whole coffee shop.
    ports: ['127.0.0.1:8787:3001']
    # Replaces .env.prod. A rehearsal must never be one typo away from loading
    # production keys or pointing at the production database.
    env_file: ['.env.local']
    environment:
      # BOTH local ports. `pnpm dev:web` serves on 5173 and `vite preview` on
      # 4173; pinning only one makes the other fail with a bare "Failed to fetch"
      # in the browser and no hint that the origin is the problem (cost an hour
      # on 2026-07-30). CORS is credentialed, so these are exact string matches —
      # no trailing slash, no path.
      WEB_ORIGIN: http://localhost:5173,http://localhost:4173
      # No Caddy in front, so there is no proxy hop to trust. Left at the
      # production value deliberately: with no X-Forwarded-For present Fastify
      # falls back to the socket address, so the rate limiter still keys per
      # client and this stays identical to production behaviour.
      RATE_LIMIT_MAX: '3000'
    # Same key mounts as the worker (below): the api MINTS deeds on entry
    # payment, which has been silently disabled in-container since the docker
    # move because the image ships no secrets and the env pointed at host paths.
    volumes:
      - ~/.config/solana/id.json:/app/keys/admin.keypair.json:ro
      - ./keys:/app/keys/ops:ro

  worker:
    env_file: ['.env.local']
    # Signing keys, mounted READ-ONLY from the host. They are gitignored, so
    # they are not in the image (the Dockerfile copies no secrets — deliberate),
    # and an env var pointing at a HOST path crash-looped the worker with ENOENT
    # on 2026-08-03. The env file must reference the CONTAINER paths below
    # (/app/keys/...). Read-only because nothing in the app ever writes a key.
    volumes:
      - ~/.config/solana/id.json:/app/keys/admin.keypair.json:ro
      - ./keys:/app/keys/ops:ro
