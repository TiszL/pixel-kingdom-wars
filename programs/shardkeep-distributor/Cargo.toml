[package]
name = "shardkeep-distributor"
version = "0.1.0"
description = "SHARDKEEP TGE-simulation merkle claim distributor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shardkeep_distributor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
# keccak256: syscall on-chain, sha3 crate on host (anchor-lang 0.32 does not
# re-export solana_program::keccak).
solana-keccak-hasher = { version = "2.2.1", features = ["sha3"] }
