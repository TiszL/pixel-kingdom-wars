[package]
name = "shardkeep-league"
version = "0.1.0"
description = "SHARDKEEP funded weekly league sum-Merkle claims"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shardkeep_league"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
devnet-test = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
solana-keccak-hasher = { version = "2.2.1", features = ["sha3"] }
