<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>KEEP Token Logo Assets</title>
<style>
body{margin:0;background:#15181f;color:#e8e2d0;font-family:'Segoe UI',system-ui,sans-serif;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:8px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
p.sub{margin:0 0 40px;color:#8b8a94;font-size:14px}
.row{display:flex;gap:48px;flex-wrap:wrap;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:14px}
.frame{width:280px;height:280px;border-radius:16px;background-image:linear-gradient(45deg,#2a2d38 25%,transparent 25%),linear-gradient(-45deg,#2a2d38 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2a2d38 75%),linear-gradient(-45deg,transparent 75%,#2a2d38 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;background-color:#1c1e26;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.frame img{width:220px;height:220px;image-rendering:pixelated}
.label{font-size:15px;font-weight:600}
.meta{font-size:12px;color:#8b8a94;text-align:center;line-height:1.5}
code{background:#25272f;padding:2px 6px;border-radius:4px;font-size:11px;color:#e3ae3c}
</style>
</head>
<body>
<h1>KEEP Token Logo</h1>
<p class="sub">512×512, transparent background — pick one before deploying</p>
<div class="row">
<div class="card">
<div class="frame"><img src="keep_token_logo_512.png" alt="Static KEEP token logo"></div>
<div class="label">Static</div>
<div class="meta"><code>keep_token_logo_512.png</code><br>Faithful, unedited coin art</div>
</div>
<div class="card">
<div class="frame"><img src="keep_token_shine_512.gif" alt="Animated shining KEEP token logo"></div>
<div class="label">Animated — shine sweep</div>
<div class="meta"><code>keep_token_shine_512.gif</code><br>Gold gleam sweeps every ~2s, loops</div>
</div>
</div>
</body>
</html>
