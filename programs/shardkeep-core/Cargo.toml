[package]
name = "shardkeep-core"
version = "0.1.0"
description = "SHARDKEEP entry payments + player registry + epoch merkle roots"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shardkeep_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
