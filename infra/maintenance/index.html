  html, body {
    margin: 0; min-height: 100%; background: #100e14; color: #efe8d6;
    font-family: 'VT323', monospace; -webkit-font-smoothing: none;
  }
  .bg {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 40%; image-rendering: pixelated;
  }
  .wrap {
    position: relative; min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    gap: 18px; padding: max(18px, 4vh) 16px max(18px, 6vh); text-align: center;
  }
  .logo {
    display: block; width: min(78vw, 480px); height: auto; image-rendering: pixelated;
    filter: drop-shadow(0 2px 0 #100e14) drop-shadow(0 0 5px rgba(16, 14, 20, .9))
      drop-shadow(0 0 22px rgba(16, 14, 20, .6));
  }
  .plate {
    box-sizing: border-box; width: min(100%, 460px); padding: 18px 20px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background: linear-gradient(rgba(26, 23, 30, .84), rgba(16, 14, 20, .9));
    border: 1px solid rgba(107, 99, 84, .7);
    box-shadow: 0 0 32px 18px rgba(16, 14, 20, .55);
  }
  h1 {
    margin: 0; font-weight: 400; font-size: clamp(28px, 8vw, 40px); line-height: 1;
    letter-spacing: 2px; color: #f4d77b; text-shadow: 0 2px 0 #100e14;
  }
  p { margin: 0; font-size: 21px; line-height: 1.2; color: #efe8d6; }
  .bar {
    width: min(100%, 260px); height: 10px; box-sizing: content-box;
    border: 2px solid #6b6354; background: #100e14; overflow: hidden;
  }
  .bar span {
    display: block; height: 100%; width: 35%; background: #e3ae3c;
    box-shadow: inset 0 2px 0 #f4d77b;
    animation: sweep 1.8s linear infinite;
  }
