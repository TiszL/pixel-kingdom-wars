[package]
name = "shardkeep-craft"
version = "0.1.0"
description = "SHARDKEEP guarded Charter collection bootstrap; local acceptance only"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shardkeep_craft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
devnet-test = []

[dependencies]
anchor-lang = "=0.32.1"
mpl-core = { version = "=0.11.2", default-features = false, features = ["anchor"] }

shardkeep-charter-interface = { path = "../charter-interface" }
solana-keccak-hasher = { version = "2.2.1", features = ["sha3"] }
