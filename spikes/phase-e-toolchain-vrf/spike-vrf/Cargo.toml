[package]
name = "spike-vrf"
version = "0.1.0"
description = "S2 spike: ephemeral-vrf-sdk 0.17.2 (anchor-compat) under anchor-lang 0.32.1 / Agave 2.3.13"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "spike_vrf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.32.1"  # programs/Cargo.lock pins 0.32.1; caret would resolve 0.32.2
ephemeral-vrf-sdk = { version = "0.17.2", default-features = false, features = ["anchor-compat"] }
