# Production chain pins (Phase E on devnet). PUBLIC values only: program ids, mints, owners, a slot, a sha256 and a
# policy name. Never a key, a secret, an RPC URL or a file path.
#
# Who reads this file: app/build.gradle.kts, for every build that is NOT a test-origin build (the release build players
# install, and a production-origin debug build). A test-origin debug build (-PnativeCandidateOrigin / -PnativeLocalOrigin)
# takes its pins from -Ppkw* on the command line instead and never reads this file; -Ppkw* on any other build fails it.
#
# Fail closed (data/ChainPins.kt, ChainPinsTest):
#   - all thirteen identity pins blank: the build carries no pins and every chain family (auction, realm sale,
#     realm-sale failure, mining claim, mining tax) stays dark.
#   - a REQUIRED pin blank while others are set (partial): the app keeps EVERY family dark, and checkReleaseChainPins
#     refuses a release build. Required = the twelve identity pins below other than pkwKeepReserveOwner.
#   - pkwKeepReserveOwner is OPTIONAL: blank, ONLY the mining claim and mining tax families (the two that sign
#     against the KEEP reserve) are dark and every other family stays lit; set, it is required and checked like the rest.
#   - a devnet TEST id, or a cluster other than devnet: checkReleaseChainPins refuses a release.
#   - a malformed value: the build fails at configuration (the same shapes as -Ppkw*).
#
# Every value must byte-match what the production API serves, or the server's prepared messages differ from these pins
# and every realm sale, tax claim and bid is refused (wallet RealmSaleTransaction.kt and the auction/mining verifiers
# compare them exactly). Any later economy program upgrade changes the slot and sha256: refill this file and ship a new
# version code before players can sell or claim again.
#
# pin                        <- server env name (production API env, unless noted)
# pkwChainCluster            <- SOLANA_CLUSTER (must be devnet)
# pkwEconomyProgramId        <- SEEKER_REALM_SALE_PROGRAM_ID (= SEEKER_AUCTION_PROGRAM_ID)
# pkwCraftProgramId          <- the accepted craft program id (CHARTER_RECOVERY_CRAFT_PROGRAM_ID when that is set)
# pkwLeagueProgramId         <- the accepted league program id (programs/Anchor.toml shardkeep_league); no client consumer yet
# pkwSkrMint                 <- SEEKER_AUCTION_MINT (= SEEKER_REALM_SALE_AUCTION_MINT = infra/devnet.addresses.json skrMint)
# pkwSkrDecimals             <- infra/devnet.addresses.json skrDecimals
# pkwKeepMint                <- infra/devnet.addresses.json keepMintV4 when PHASE_E_KEEP_IDENTITY=keep-v4, else keepMint
# pkwKeepReserveOwner        <- PHASE_E_KEEP_RESERVE_OWNER when PHASE_E_KEEP_IDENTITY=keep-v4, else GEMS_RESERVE_OWNER;
#                               OPTIONAL: blank while the production API sets neither (mining claim + mining tax dark)
# pkwEconomyDeploymentSlot   <- SEEKER_REALM_SALE_DEPLOYMENT_SLOT (= SEEKER_AUCTION_DEPLOYMENT_SLOT)
# pkwEconomyProgramDataSha256<- SEEKER_REALM_SALE_PROGRAM_DATA_SHA256 (= SEEKER_AUCTION_PROGRAM_DATA_SHA256)
# pkwEconomyUpgradeAuthority <- SEEKER_REALM_SALE_UPGRADE_AUTHORITY (= SEEKER_AUCTION_UPGRADE_AUTHORITY), or none
# pkwRealmSaleDeveloper      <- SEEKER_REALM_SALE_DEVELOPER
# pkwRealmSalePolicyRevision <- SEEKER_REALM_SALE_POLICY_REVISION
#
# pkwSkrFaucet (on | off | blank = off) is not an identity pin: it is the SKR faucet's own switch, independent of the
# auction's SKR mint. Off, production shows the auction with the real SKR mint and no "test SKR" faucet. On, the faucet
# claims the pinned SKR, and the production server's /devnet-skr-faucet/status still decides (DEVNET_SKR_FAUCET_ENABLED);
# the server refuses every claim when its faucet is off.
#
# Accepted devnet set of 2026-10-11. The league program is accepted but not deployed (no client consumer). KEEP v4 is
# later (PHASE_E_KEEP_IDENTITY=disabled), so pkwKeepMint is the registry keepMint (v3). pkwKeepReserveOwner is blank
# because the production API serves no reserve owner yet: this release keeps exactly the mining claim and mining tax
# families dark while the auction, realm sale, craft and league identities stay lit. pkwSkrFaucet=on matches the
# production API's DEVNET_SKR_FAUCET_ENABLED=true (faucet authority 6Dz6bCvvdNQrvHiNqABVAJ6ghFxY4LXXLFczqYVm6Qw2).
