# Spike-only Anchor workspace so `anchor idl build` can discover the crates.
# Program ids are the System Program id on purpose: nothing here is deployable.
[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
spike_mpl_core_a = "11111111111111111111111111111111"
spike_mpl_core_b = "11111111111111111111111111111111"
spike_mpl_core_c = "11111111111111111111111111111111"
spike_economy_core = "11111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["spike-mpl-core-a", "spike-mpl-core-b", "spike-mpl-core-c", "spike-economy-core"]
